<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo de Nova Landing TT</title>
</head>
<body>

    <header>logo</header>

    <main>

        <div class="container-tabela-resultado">

            <div class="wrapper-tabela-resultado">

                <div class="linha-tabela-resultado" data-linha="receitas">
                    <span class="index-linha-tabela-resultado">1.</span>
                    <span class="conceito-linha-tabela-resultado">Receitas</span>
                    <span class="valor-linha-tabela-resultado" data-valor-linha-tabela="receitas">xxxx</span>
                </div>

                <div class="linha-tabela-resultado" data-linha="despesas">
                    <span class="index-linha-tabela-resultado">2.</span>
                    <span class="conceito-linha-tabela-resultado">Despesas</span>
                    <span class="valor-linha-tabela-resultado" data-valor-linha-tabela="despesas">xxxx</span>
                </div>    

                <div class="divisor-linha-tabela-resultado"></div>
                
                <div class="linha-tabela-resultado" data-linha="resultado primario">
                    <span class="index-linha-tabela-resultado">3.</span>
                    <span class="conceito-linha-tabela-resultado">Resultado Primário</span>
                    <span class="operacao-linha-tabela-resultado">( 1 &ndash; 2 )</span>
                    <span class="valor-linha-tabela-resultado" data-valor-linha-tabela="resultado primario">xxxx</span>
                </div>        
                
                <div class="linha-tabela-resultado" data-linha="juros">
                    <span class="index-linha-tabela-resultado">4.</span>
                    <span class="conceito-linha-tabela-resultado">Juros da Dívida</span>
                    <span class="valor-linha-tabela-resultado" data-valor-linha-tabela="juros">xxxx</span>
                </div>   
                
                <div class="divisor-linha-tabela-resultado"></div>      
                
                <div class="linha-tabela-resultado" data-linha="resultado nominal">
                    <span class="index-linha-tabela-resultado">5.</span>
                    <span class="conceito-linha-tabela-resultado">Resultado Nominal</span>
                    <span class="operacao-linha-tabela-resultado">( 3 + 4 )</span>
                    <span class="valor-linha-tabela-resultado" data-valor-linha-tabela="resultado nominal">xxxx</span>
                </div>  
                
                <div class="linha-tabela-resultado" data-linha="vencimentos">
                    <span class="index-linha-tabela-resultado">6.</span>
                    <span class="conceito-linha-tabela-resultado">Dívida que vence no período</span>
                    <span class="valor-linha-tabela-resultado" data-valor-linha-tabela="vencimentos">xxxx</span>
                </div>   
                
                <div class="divisor-linha-tabela-resultado"></div>      
                
                <div class="linha-tabela-resultado" data-linha="necessidade de financiamento">
                    <span class="index-linha-tabela-resultado">7.</span>
                    <span class="conceito-linha-tabela-resultado">Necessidade de Financiamento</span>
                    <span class="operacao-linha-tabela-resultado">( 5 + 6 )</span>
                    <span class="valor-linha-tabela-resultado" data-valor-linha-tabela="necessidade de financiamento">xxxx</span>
                </div>              

            </div>

        </div>            

    </main>
    
</body>
</html>
